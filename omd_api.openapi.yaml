        |------|------|------|------|
        | id | integer | 否 | 有=编辑，无=新增（新增默认 off_sale） |
        | categoryId | integer | 新增必填 | 分类 Id |
        | name | string | 新增必填 | 菜品名 |
        | description | string | 否 | 描述 |
        | price | integer | 新增必填 | 售价（分） |
        | originalPrice | integer | 否 | 划线价（分） |
        | unit | string | 否 | 默认「份」 |
        | imageUrl | string | 否 | 图片 |
        | tags | string[] | 否 | 标签 |
        | spicyLevel | integer | 否 | 0~3 |
        | stock | integer | 否 | 默认 -1 |
        | sort | integer | 否 | 排序 |

        **返回 data**：完整菜品对象（同详情）
      operationId: saveMenuItem
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
