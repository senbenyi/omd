services:
  postgres:
    image: postgres:16-alpine
    container_name: omd_postgres
    environment:
      POSTGRES_USER: omd
      POSTGRES_PASSWORD: omd_secret
      POSTGRES_DB: omd_restaurant
    ports:
      - "5432:5432"
    volumes:
      - omd_pg_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omd -d omd_restaurant"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  omd_pg_data:
